<!DOCTYPE html>
<html lang="es" class="h-full bg-gray-50">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rental Management</title>
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="h-full">
  <div class="container-fluid">
    <div class="row">
      <!-- Sidebar -->
      <nav class="col-md-2 d-none d-md-block bg-dark sidebar vh-100 p-3">
        <h5 class="text-white mb-4">Rental Mgmt</h5>
        <ul class="nav flex-column">
          <li class="nav-item"><a href="/app/" class="nav-link text-white">Dashboard</a></li>
          <li class="nav-item"><a href="/app/leases" class="nav-link text-white">Contratos</a></li>
          <li class="nav-item"><a href="/app/invoices" class="nav-link text-white">Facturas</a></li>
          <li class="nav-item"><a href="/app/payments" class="nav-link text-white">Pagos</a></li>
          <li class="nav-item"><a href="/app/expenses" class="nav-link text-white">Gastos</a></li>
          <li class="nav-item"><a href="/docs" class="nav-link text-white" target="_blank">API Docs</a></li>
        </ul>
      </nav>
      <main class="col-md-10 ms-sm-auto px-4 py-4">
        {% block content %}{% endblock %}
      </main>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
