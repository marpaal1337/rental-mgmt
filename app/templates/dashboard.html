{% extends "base.html" %}
{% block content %}
<h2>Dashboard</h2>
<div class="row mt-4">
  <div class="col-md-3">
    <div class="card text-bg-primary mb-3">
      <div class="card-body">
        <h5 class="card-title">{{ stats.leases }}</h5>
        <p class="card-text">Contratos activos</p>
      </div>
    </div>
  </div>
  <div class="col-md-3">
    <div class="card text-bg-success mb-3">
      <div class="card-body">
        <h5 class="card-title">{{ stats.invoices }}</h5>
        <p class="card-text">Facturas este mes</p>
      </div>
    </div>
  </div>
  <div class="col-md-3">
    <div class="card text-bg-warning mb-3">
      <div class="card-body">
        <h5 class="card-title">{{ stats.payments }}</h5>
        <p class="card-text">Pagos este mes</p>
      </div>
    </div>
  </div>
  <div class="col-md-3">
    <div class="card text-bg-info mb-3">
      <div class="card-body">
        <h5 class="card-title">{{ stats.expenses }}</h5>
        <p class="card-text">Gastos este año</p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
